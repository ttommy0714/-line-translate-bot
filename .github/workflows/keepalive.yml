name: Keep Render Service Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 "https://line-translate-bot-wvbq.onrender.com/health"

      - name: Warm translation endpoint
        run: |
          curl -fsS --retry 2 --retry-delay 10 --max-time 90 "https://line-translate-bot-wvbq.onrender.com/test-translate?q=%E4%BD%A0%E5%A5%BD&to=id"
