name: Keep Render Service Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 "https://line-translate-bot-wvbq.onrender.com/health"
